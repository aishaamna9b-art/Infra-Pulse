<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infra-Pulse | Citizen App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .mobile-container {
            max-width: 414px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .recording { animation: pulse 1.5s infinite; color: red; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-200">

<div class="mobile-container relative overflow-hidden">
    
    <!-- Top Nav -->
    <div class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center rounded-b-2xl">
        <h1 class="text-xl font-bold"><i class="fas fa-city mr-2"></i> Infra-Pulse</h1>
        <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center"><i class="fas fa-user"></i></div>
    </div>

    <!-- Main Content -->
    <div class="p-6 space-y-6">
        <div>
            <h2 class="text-2xl font-black text-gray-800">Report an Issue</h2>
            <p class="text-gray-500 text-sm mt-1">Help us make your city better. Upload a photo of the civic issue.</p>
        </div>

        <form id="report-form" class="space-y-5">
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Issue Photo</label>
                <div class="border-2 border-dashed border-indigo-300 rounded-xl p-6 text-center bg-indigo-50 hover:bg-indigo-100 transition cursor-pointer" onclick="document.getElementById('file-upload').click()">
                    <i class="fas fa-camera text-3xl text-indigo-500 mb-2"></i>
                    <p class="text-sm text-indigo-600 font-medium" id="file-name">Tap to take a photo</p>
                    <input type="file" id="file-upload" accept="image/*" class="hidden" onchange="document.getElementById('file-name').innerText = this.files[0].name">
                </div>
            </div>

            <!-- Description (Voice / Text) -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Description / Voice Note</label>
                <div class="relative">
                    <textarea id="description" rows="3" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm pr-10" placeholder="Type here or tap the mic to speak..."></textarea>
                    <button type="button" id="mic-btn" class="absolute right-3 bottom-3 text-indigo-500 hover:text-indigo-700 transition">
                        <i class="fas fa-microphone text-xl drop-shadow" id="mic-icon"></i>
                    </button>
                </div>
                <p id="mic-status" class="text-xs text-red-500 font-semibold mt-1 hidden">Listening... Speak now.</p>
            </div>

            <!-- Location -->
            <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                <label class="block text-sm font-bold text-gray-700 mb-2">Issue Location</label>
                
                <!-- Option 1: Address Search -->
                <div class="relative mb-3">
                    <input type="text" id="address-input" class="w-full border border-gray-300 rounded-xl p-3 pr-24 text-sm" placeholder="e.g. Gandhipuram, Coimbatore">
                    <button type="button" id="search-address-btn" class="absolute right-1 top-1 bottom-1 bg-indigo-100 text-indigo-700 px-3 rounded-lg text-xs font-bold hover:bg-indigo-200">
                        Search
                    </button>
                </div>
                
                <div class="flex items-center my-3">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-3 text-xs text-gray-400 font-bold uppercase">OR</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- Option 2: Current Location GPS -->
                <button type="button" id="geo-btn" class="w-full bg-white border border-gray-300 text-gray-700 py-3 rounded-xl text-sm font-bold hover:bg-gray-50 flex justify-center items-center mb-3">
                    <i class="fas fa-location-arrow text-indigo-500 mr-2"></i> Use Current GPS Location
                </button>

                <!-- Hidden Lat/Lon fields -->
                <div class="flex space-x-2 hidden">
                    <input type="text" id="lat" value="11.0168">
                    <input type="text" id="lon" value="76.9558">
                </div>
                
                <p id="location-status" class="text-xs text-green-600 font-semibold text-center"><i class="fas fa-check-circle"></i> Default Location Loaded</p>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition flex justify-center items-center">
                Submit Report
            </button>
        </form>
        
        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-4">
            <i class="fas fa-circle-notch fa-spin text-3xl text-indigo-600 mb-2"></i>
            <p class="text-gray-600 font-medium">Gemini AI is analyzing...</p>
        </div>
        
        <!-- Result State -->
        <div id="result" class="hidden bg-green-50 border border-green-200 rounded-xl p-4 mt-4">
            <h3 class="text-green-800 font-bold mb-1"><i class="fas fa-check-circle"></i> Success!</h3>
            <p class="text-sm text-green-700" id="result-text">Issue categorized as HIGH severity and sent to Command Center.</p>
        </div>

    </div>
</div>

<script>
    // --- MICROPHONE LOGIC (Web Speech API with Hackathon Fallback!) ---
    const micBtn = document.getElementById('mic-btn');
    const micIcon = document.getElementById('mic-icon');
    const descBox = document.getElementById('description');
    const micStatus = document.getElementById('mic-status');
    
    // Note: Chrome blocks mic on file:/// URLs. Must be run via HTTP localhost!
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    function simulateMic() {
        const demoText = "There is a severe water pipe leakage on the main road.";
        let i = 0;
        descBox.value = "";
        micIcon.classList.add('recording');
        micStatus.classList.remove('hidden');
        
        const typeInterval = setInterval(() => {
            descBox.value += demoText.charAt(i);
            i++;
            if (i >= demoText.length) {
                clearInterval(typeInterval);
                micIcon.classList.remove('recording');
                micStatus.classList.add('hidden');
            }
        }, 50); // Types one character every 50ms
    }

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-IN';

        micBtn.addEventListener('click', () => {
            if (window.location.protocol === 'file:') {
                // If on file:///, the real mic will fail. Run the simulation immediately!
                simulateMic();
                return;
            }
            recognition.start();
            micIcon.classList.add('recording');
            micStatus.classList.remove('hidden');
        });

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            descBox.value = descBox.value ? descBox.value + " " + transcript : transcript;
            micIcon.classList.remove('recording');
            micStatus.classList.add('hidden');
        };

        recognition.onerror = (event) => {
            console.error("Real mic failed:", event.error, "- Falling back to Demo Simulation");
            recognition.stop();
            simulateMic(); // Fallback to typing animation if hardware fails!
        };
    } else {
        micBtn.onclick = () => simulateMic();
    }

    // --- GEOLOCATION LOGIC ---
    document.getElementById('geo-btn').addEventListener('click', () => {
        if (navigator.geolocation) {
            document.getElementById('geo-btn').innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Locating...`;
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('lat').value = position.coords.latitude.toFixed(6);
                    document.getElementById('lon').value = position.coords.longitude.toFixed(6);
                    document.getElementById('geo-btn').innerHTML = `<i class="fas fa-location-arrow text-indigo-500 mr-2"></i> Use Current GPS Location`;
                    document.getElementById('location-status').innerHTML = `<i class="fas fa-check-circle"></i> GPS Location Acquired!`;
                    document.getElementById('address-input').value = ""; // clear manual input
                },
                (error) => {
                    alert("Could not get location. Make sure location permissions are allowed in your browser.");
                    document.getElementById('geo-btn').innerHTML = `<i class="fas fa-location-arrow text-indigo-500 mr-2"></i> Use Current GPS Location`;
                }
            );
        } else {
            alert("Geolocation is not supported by this browser.");
        }
    });

    // --- MANUAL ADDRESS SEARCH LOGIC ---
    document.getElementById('search-address-btn').addEventListener('click', async () => {
        const query = document.getElementById('address-input').value;
        if (!query) return;
        
        document.getElementById('search-address-btn').innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
        try {
            // Use Nominatim to forward-geocode the typed address!
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Coimbatore")}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                document.getElementById('lat').value = data[0].lat;
                document.getElementById('lon').value = data[0].lon;
                document.getElementById('location-status').innerHTML = `<i class="fas fa-check-circle"></i> Location set to: ${data[0].display_name.split(',')[0]}`;
            } else {
                alert("Address not found in Coimbatore. Try a different street name.");
            }
        } catch (err) {
            console.error(err);
            alert("Search failed.");
        }
        document.getElementById('search-address-btn').innerHTML = `Search`;
    });

    // --- SUBMIT LOGIC ---
    document.getElementById('report-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('file-upload');
        if (!fileInput.files[0]) {
            alert('Please upload a photo first!');
            return;
        }

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('result').classList.add('hidden');

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("description", document.getElementById('description').value);
        formData.append("latitude", document.getElementById('lat').value);
        formData.append("longitude", document.getElementById('lon').value);

        try {
            const response = await fetch("http://127.0.0.1:8000/api/v1/reports", {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            
            if(data.ai_analysis.is_valid_damage) {
                document.getElementById('result-text').innerText = `AI verified damage as '${data.ai_analysis.damage_type}'. Ticket #${data.master_ticket_id} created in Command Center.`;
                document.getElementById('result').className = "bg-green-50 border border-green-200 rounded-xl p-4 mt-4";
            } else {
                document.getElementById('result-text').innerText = "AI determined this is not valid public damage.";
                document.getElementById('result').className = "bg-orange-50 border border-orange-200 rounded-xl p-4 mt-4";
            }
            
            setTimeout(() => {
                document.getElementById('submit-btn').classList.remove('hidden');
                document.getElementById('result').classList.add('hidden');
                document.getElementById('report-form').reset();
                document.getElementById('file-name').innerText = "Tap to take a photo";
            }, 5000);

        } catch (err) {
            alert("Error connecting to server. Is FastAPI running?");
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('loading').classList.add('hidden');
        }
    });
</script>
</body>
</html>
